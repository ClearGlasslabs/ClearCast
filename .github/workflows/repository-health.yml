name: Repository Health

on:
  pull_request:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate changed source and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run deterministic repository checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          ZERO_SHA = "0" * 40
          SKIP_PARTS = {
              ".git",
              ".venv",
              "build",
              "coverage",
              "dist",
              "node_modules",
              "vendor",
          }
          TEXT_SUFFIXES = {
              ".css", ".html", ".js", ".json", ".jsx", ".md", ".mjs",
              ".py", ".sh", ".toml", ".ts", ".tsx", ".txt", ".xml",
              ".yaml", ".yml",
          }
          CONFLICT_MARKER = re.compile(r"^(?:<{7}|={7}|>{7})(?: .*)?$", re.MULTILINE)
          ACTION_USE = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)\s*(?:#.*)?$", re.MULTILINE)
          FULL_SHA = re.compile(r"^[0-9a-fA-F]{40}$")

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          base = os.environ.get("BASE_SHA", "").strip()
          head = os.environ.get("HEAD_SHA", "HEAD").strip() or "HEAD"
          use_diff = bool(base and base != ZERO_SHA)
          if use_diff:
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"{base}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0
              use_diff = exists

          if use_diff:
              names = git("diff", "--name-only", "--diff-filter=ACMR", f"{base}...{head}").splitlines()
          else:
              names = git("ls-files").splitlines()

          files = []
          for name in names:
              path = Path(name)
              if not path.is_file() or any(part in SKIP_PARTS for part in path.parts):
                  continue
              files.append(path)

          errors: list[str] = []
          checked = 0

          for path in files:
              suffix = path.suffix.lower()
              if suffix not in TEXT_SUFFIXES and path.name not in {"Dockerfile", "Makefile"}:
                  continue

              try:
                  raw = path.read_bytes()
              except OSError as exc:
                  errors.append(f"{path}: cannot read file: {exc}")
                  continue

              if b"\0" in raw or len(raw) > 5_000_000:
                  continue

              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError as exc:
                  errors.append(f"{path}: text file is not valid UTF-8: {exc}")
                  continue

              checked += 1

              if suffix not in {".md", ".txt"} and CONFLICT_MARKER.search(text):
                  errors.append(f"{path}: unresolved merge-conflict marker")

              try:
                  if suffix == ".json":
                      json.loads(text)
                  elif suffix == ".toml":
                      tomllib.loads(text)
                  elif suffix == ".py":
                      ast.parse(text, filename=str(path))
              except (SyntaxError, ValueError, json.JSONDecodeError, tomllib.TOMLDecodeError) as exc:
                  errors.append(f"{path}: parse failure: {exc}")

              if suffix == ".sh":
                  result = subprocess.run(
                      ["bash", "-n", str(path)],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if result.returncode:
                      detail = (result.stderr or result.stdout).strip()
                      errors.append(f"{path}: shell syntax failure: {detail}")

              if path.parts[:2] == (".github", "workflows") and suffix in {".yml", ".yaml"}:
                  if not re.search(r"^permissions:\s*(?:$|\{)", text, re.MULTILINE):
                      errors.append(f"{path}: workflow must declare top-level permissions")
                  for target in ACTION_USE.findall(text):
                      if target.startswith(("./", "docker://")) or "@" not in target:
                          continue
                      action, ref = target.rsplit("@", 1)
                      if not FULL_SHA.fullmatch(ref):
                          errors.append(f"{path}: external action is not pinned to a full SHA: {action}@{ref}")

          print(f"Validated {checked} changed/tracked text files.")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          PY
