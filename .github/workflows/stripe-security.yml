name: Stripe integration security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevent-stripe-secret-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Stripe credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk|rk)_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}' -- ':!*.lock' ':!stripe-security.yml'; then
            echo 'Stripe credential-like value detected. Store credentials in encrypted GitHub or deployment secrets.' >&2
            exit 1
          fi
      - name: Document required integration contract
        shell: bash
        run: |
          cat <<'EOF'
          ClearGlass Stripe account: acct_1TG2qt65MGeeiD4K
          Required encrypted variables when Stripe is enabled:
          STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET
          STRIPE_ALLOWED_PRICE_IDS
          STRIPE_SUCCESS_URL
          STRIPE_CANCEL_URL
          Rules: hosted Checkout; server-side price allowlist; raw-body webhook verification; idempotent event processing; no credentials in source control.
          EOF
